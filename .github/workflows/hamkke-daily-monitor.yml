name: Hamkke Bank daily monitor
on:
  schedule:
    - cron: '10 0 * * *'  # 09:10 KST, daily
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase and summarize yesterday's classes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_MONITOR_EMAIL: ${{ secrets.SUPABASE_MONITOR_EMAIL }}
          SUPABASE_MONITOR_PASSWORD: ${{ secrets.SUPABASE_MONITOR_PASSWORD }}
        run: python3 scripts/daily_monitor.py
